<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1474" viewBox="0 0 1240 1474">
<defs>
  <style>
    .ff { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .h1 { font-size: 31px; font-weight: 700; fill: #1B1A17; }
    .h2 { font-size: 16px; fill: #6E6A60; }
    .bt { font-size: 21.5px; font-weight: 700; fill: #1B1A17; }
    .bs { font-size: 11.5px; font-weight: 700; letter-spacing: 1.1px; }
    .bd { font-size: 14.8px; fill: #4B4841; }
    .al { font-size: 14px; fill: #7C776C; }
    .nb { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .ft { font-size: 15px; font-weight: 700; fill: #1B1A17; }
    .fb { font-size: 13.4px; fill: #4B4841; }
    .pill { font-size: 12.5px; font-weight: 700; letter-spacing: 0.6px; fill: #A8271B; }
  </style>
</defs>

<rect width="1240" height="1474" fill="#FBFAF7"/>

<!-- header -->
<text class="ff h1" x="100" y="64">How High Signal works</text>
<text class="ff h2" x="100" y="94">From the open web to your screen, in five steps</text>

<!-- ============ 1. SOURCES ============ -->
<rect x="150" y="130" width="940" height="118" rx="14" fill="#F4F2EC" stroke="#DAD6CC" stroke-width="1.5"/>
<circle cx="100" cy="170" r="21" fill="#8A8578"/>
<text class="ff nb" x="100" y="177" text-anchor="middle">1</text>
<text class="ff bt" x="178" y="172">27 news &amp; research sites</text>
<text class="ff bs" x="178" y="194" fill="#8A8578">OUT ON THE PUBLIC INTERNET</text>
<text class="ff bd" x="178" y="222">Newsletters, research blogs, Hacker News, arXiv, Techmeme. All public pages — nothing behind a login.</text>

<line x1="620" y1="256" x2="620" y2="312" stroke="#B5B0A5" stroke-width="2.2"/>
<polygon points="620,322 613,308 627,308" fill="#B5B0A5"/>
<text class="ff al" x="648" y="294">reads the headlines</text>

<!-- ============ 2. COLLECTOR ============ -->
<rect x="150" y="330" width="940" height="184" rx="14" fill="#E9F2EC" stroke="#B8D3C3" stroke-width="1.5"/>
<circle cx="100" cy="370" r="21" fill="#2E6B4F"/>
<text class="ff nb" x="100" y="377" text-anchor="middle">2</text>
<text class="ff bt" x="178" y="372">The Collector</text>
<text class="ff bs" x="178" y="394" fill="#2E6B4F">RUNS BY ITSELF, EVERY 30 MINUTES, ON GITHUB'S COMPUTERS</text>
<circle cx="184" cy="421" r="3" fill="#2E6B4F"/>
<text class="ff bd" x="200" y="426">Visits each site one at a time, pausing in between, so it never hammers anyone's server.</text>
<circle cx="184" cy="451" r="3" fill="#2E6B4F"/>
<text class="ff bd" x="200" y="456">Throws out the junk, and merges the same story when three different sites all carry it.</text>
<circle cx="184" cy="481" r="3" fill="#2E6B4F"/>
<text class="ff bd" x="200" y="486">Scores every headline from 5 to 100 on how likely it is to be worth your click.</text>

<line x1="620" y1="522" x2="620" y2="578" stroke="#C0392B" stroke-width="2.2" stroke-dasharray="7 5"/>
<polygon points="620,588 613,574 627,574" fill="#C0392B"/>
<text class="ff al" x="648" y="560">files one finished list</text>
<rect x="404" y="539" width="186" height="30" rx="15" fill="#FBE9E6" stroke="#E2A79E" stroke-width="1.4"/>
<circle cx="426" cy="554" r="8" fill="#C0392B"/>
<text class="ff" x="426" y="559" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">!</text>
<text class="ff pill" x="442" y="559">STUCK HERE TODAY</text>

<!-- ============ 3. FILING CABINET ============ -->
<rect x="150" y="596" width="940" height="152" rx="14" fill="#FBF0E2" stroke="#E5C79C" stroke-width="1.5"/>
<circle cx="100" cy="636" r="21" fill="#A9701F"/>
<text class="ff nb" x="100" y="643" text-anchor="middle">3</text>
<text class="ff bt" x="178" y="638">The Filing Cabinet</text>
<text class="ff bs" x="178" y="660" fill="#A9701F">ONE FILE, THROWN AWAY AND REWRITTEN EACH RUN</text>
<text class="ff bd" x="178" y="690">The finished list of around 200 headlines, with its scores already worked out.</text>
<text class="ff bd" x="178" y="716">The Collector puts the list in. The Website takes it out. The two never speak to each other directly.</text>

<line x1="620" y1="756" x2="620" y2="812" stroke="#B5B0A5" stroke-width="2.2"/>
<polygon points="620,822 613,808 627,808" fill="#B5B0A5"/>
<text class="ff al" x="648" y="794">picks up the list</text>

<!-- ============ 4. WEBSITE ============ -->
<rect x="150" y="830" width="940" height="152" rx="14" fill="#E9EEF8" stroke="#B4C4E0" stroke-width="1.5"/>
<circle cx="100" cy="870" r="21" fill="#2F5AA8"/>
<text class="ff nb" x="100" y="877" text-anchor="middle">4</text>
<text class="ff bt" x="178" y="872">The Website</text>
<text class="ff bs" x="178" y="894" fill="#2F5AA8">WAKES UP ONLY WHEN SOMEONE OPENS THE PAGE</text>
<text class="ff bd" x="178" y="924">Picks up whatever list is in the cabinet and sends it over. It collects nothing itself.</text>
<text class="ff bd" x="178" y="950">That separation is deliberate: a failed collection can never take the website down with it.</text>

<line x1="620" y1="990" x2="620" y2="1046" stroke="#B5B0A5" stroke-width="2.2"/>
<polygon points="620,1056 613,1042 627,1042" fill="#B5B0A5"/>
<text class="ff al" x="648" y="1028">sends it to your screen</text>

<!-- ============ 5. BROWSER ============ -->
<rect x="150" y="1064" width="940" height="152" rx="14" fill="#F2ECF7" stroke="#CBB9DC" stroke-width="1.5"/>
<circle cx="100" cy="1104" r="21" fill="#6B4A8F"/>
<text class="ff nb" x="100" y="1111" text-anchor="middle">5</text>
<text class="ff bt" x="178" y="1106">Your browser</text>
<text class="ff bs" x="178" y="1128" fill="#6B4A8F">YOUR OWN SCREEN</text>
<text class="ff bd" x="178" y="1158">Sorting, filtering and searching all happen here, instantly, with no trip back to the server.</text>
<text class="ff bd" x="178" y="1184">What you've read and what you've saved stay on your device. No accounts, no tracking.</text>

<!-- ============ FOOTER NOTES ============ -->
<rect x="150" y="1266" width="452" height="152" rx="12" fill="#FFFFFF" stroke="#DAD6CC" stroke-width="1.5"/>
<text class="ff ft" x="176" y="1300">Why is it built in two halves?</text>
<text class="ff fb" x="176" y="1330">Collecting takes several minutes — far longer</text>
<text class="ff fb" x="176" y="1352">than a web page is allowed to take to load. So</text>
<text class="ff fb" x="176" y="1374">the slow work runs on its own schedule, off to</text>
<text class="ff fb" x="176" y="1396">one side, and the website only reads the result.</text>

<rect x="638" y="1266" width="452" height="152" rx="12" fill="#FFFFFF" stroke="#E2A79E" stroke-width="1.5"/>
<circle cx="664" cy="1293" r="8" fill="#C0392B"/>
<text class="ff" x="664" y="1298" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">!</text>
<text class="ff ft" x="682" y="1300">Where it is stuck right now</text>
<text class="ff fb" x="664" y="1330">The filing cabinet has been locked since 4</text>
<text class="ff fb" x="664" y="1352">September — its storage allowance ran out.</text>
<text class="ff fb" x="664" y="1374">The Collector still runs fine; it just cannot file</text>
<text class="ff fb" x="664" y="1396">the result, so the website has nothing to give.</text>
</svg>
