name: Scrape sources

# Every 30 minutes, which the Vercel side cannot do for free: Hobby cron jobs
# are capped at one run per day. Actions has no such limit and no 300s ceiling,
# so this runs the full pass and writes it to the Blob store the app serves
# from. `workflow_dispatch` makes the same job runnable by hand.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      state_backend:
        description: >-
          Backend for this run only. Leave blank to use the repository
          variable; set d1 to publish one run into Cloudflare without
          making D1 the scheduled destination.
        required: false
        default: ''
        type: string

# A scrape that overlaps its predecessor would have both writing the same blob.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A dispatch input overrides the repository variable for this run only.
      STATE_BACKEND: ${{ inputs.state_backend || vars.STATE_BACKEND }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches .python-version, so a wheel that resolves here resolves on
          # Vercel too.
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Storage regression tests
        run: python -m unittest discover -s tests -v

      - name: Scrape and publish
        env:
          # STATE_BACKEND comes from the job env above: empty keeps the existing
          # Blob compatibility path, d1 publishes into Cloudflare.
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_PUBLIC_BASE_URL: ${{ vars.BLOB_PUBLIC_BASE_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          SCRAPE_REPORT_PATH: scrape-report.json
        run: python scrape_job.py

      - name: Upload source diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: scrape-source-diagnostics-${{ github.run_id }}
          path: scrape-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Recover queued source-tool jobs
        if: ${{ env.STATE_BACKEND == 'd1' }}
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: python source_tool_job.py --recover-limit 2
